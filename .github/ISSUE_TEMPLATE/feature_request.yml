name: Feature request
description: Suggest an improvement or new capability
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion.

  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Base
        - Pro
        - Both
        - Not sure
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: What would you like to see?
      description: Describe the feature or improvement.
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: Why would it be useful?
      description: Describe the display setup or workflow where this would help.
    validations:
      required: false
